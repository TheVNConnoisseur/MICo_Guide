[Debug]
# Debug mode status, and the key to allow said mode to be activated
DebugKey=VAL-0071
DebugON=1


# Logging, which will be done to a file called MICo_Log1.csv (when closing the game, it will be renamed to MICo_Log2.csv)
MICoLog=1                ## Enable
MICoLogProcNo=-1         ## -1: uses the MICoLogProcOutputFlgXX settings
                         ## -2: not understood.
                         ##  0-256: log only that flag
MICoLogFileSize=10000000       ## Max log file size in bits (10 MB default)
MICoLogProcOutputFlg00=1       ## Enable logging for the flag #1, and can be done up to flag number 255. The number has to be put in hexadecimal.



# As a way to access any of the debug menus quickly through any arbitrary button, if the value set in the key corresponding to a debug screen corresponds to the Virtual-Key
# (https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes) assigned to the button pressed, the menu(s) will open up
MICoDebugBT_TextSearchSkip=0x00                     ## DEBUG_テキストスキップサーチ
MICoDebugBT_RepeatSE=0x00                           ## DEBUG_SEリピート
MICoDebugBT_ClipBoard=0x00                          ## DEBUG_テキストクリップボードコピー
MICoDebugBT_RealTimeTextLog=0x00                    ## DEBUG_テキストログ表示
MICoDebugBT_TextLog=0x00                            ## DEBUG_テキストログ表示  (but saved in a file called TextLog.txt)
MICoDebugBT_RealTimeAll=0x00                        ## DEBUG_全体情報表示
MICoDebugBT_All=0x00                                ## DEBUG_全体情報表示 (but saved in a file called SysData.txt)
MICoDebugBT_RealTimeFlg=0x00                        ## DEBUG_フラグ表示
MICoDebugBT_Flg=0x00                                ## DEBUG_フラグ表示 (but saved in a file called FlgData.txt)



# Miscellanous
SeenNo=0002                 ## Enter a specific data06-/seenXXXX.sdt scene in boot up (it can be done also from the CLI by typing Debug/XXXX)
TextLogMax=5                ## Maximum number of messages logged in the DEBUG_テキストログ表示 window (capped at 100)
SoundDummyMode=0            ## If the playback of a sound file has failed, decide if to report or not the corresponding error message.
                                # Even number: do not report the message
                                # Odd number and 0: do report the message


# Debug windows positions in-screen
## DEBUG_テキストログ表示 (See the text log)
DBW_TXT_left=938
DBW_TXT_top=59
DBW_TXT_right=900
DBW_TXT_bottom=730
## DEBUG_全体情報表示 (See an overall status of all information)
DBW_ALL_left=981
DBW_ALL_top=59
DBW_ALL_right=900
DBW_ALL_bottom=730
## DEBUG_フラグ表示 (See the currently created flags)
DBW_FLG_left=919
DBW_FLG_top=72
DBW_FLG_right=900
DBW_FLG_bottom=730
## DEBUG_テキストスキップサーチ (Skip text until the searched string matches)
DBW_TextSearchSkip_left=753
DBW_TextSearchSkip_top=327
DBW_TextSearchSkip_right=400
DBW_TextSearchSkip_bottom=200


